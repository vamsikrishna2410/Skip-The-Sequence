<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop The Sequence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #F5F0E8;
      color: #2C2420;
    }

    .header {
      background: #2C2420;
      color: #F5F0E8;
      padding: 18px 20px 14px;
      text-align: center;
      position: relative;
    }

    .header::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #C8102E, #B8860B, #1D4289, #B8860B, #C8102E);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header p {
      font-size: 11px;
      color: #B8A99A;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    .content {
      padding: 16px 20px;
      background: #F5F0E8;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-group label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #7A6F65;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .field-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #D5CBBF;
      border-radius: 5px;
      font-size: 14px;
      background: #FFFDF8;
      color: #2C2420;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field-group input::placeholder {
      color: transparent;
    }

    .field-group input:focus {
      outline: none;
      border-color: #B8860B;
      box-shadow: 0 0 0 2px rgba(184, 134, 11, 0.15);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .field-group {
      flex: 1;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(44, 36, 32, 0.15);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-fill {
      background: #C8102E;
      color: #FFFDF8;
    }

    .btn-fill:hover {
      background: #A30D25;
    }

    .btn-save {
      background: #1D4289;
      color: #FFFDF8;
    }

    .btn-save:hover {
      background: #153268;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
      color: #B8860B;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      padding: 8px;
      font-size: 10px;
      color: #B8A99A;
      border-top: 1px solid #D5CBBF;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Stop The Sequence</h1>
    <p>Auto-fill job applications instantly</p>
  </div>

  <div class="content">
    <div class="row">
      <div class="field-group">
        <label>First Name</label>
        <input type="text" id="firstName">
      </div>
      <div class="field-group">
        <label>Last Name</label>
        <input type="text" id="lastName">
      </div>
    </div>

    <div class="field-group">
      <label>Email</label>
      <input type="email" id="email">
    </div>

    <div class="field-group">
      <label>Phone</label>
      <input type="tel" id="phone">
    </div>

    <div class="row">
      <div class="field-group">
        <label>City</label>
        <input type="text" id="city">
      </div>
      <div class="field-group">
        <label>State</label>
        <input type="text" id="state">
      </div>
      <div class="field-group">
        <label>Zip Code</label>
        <input type="text" id="zipCode">
      </div>
    </div>

    <div class="field-group">
      <label>LinkedIn URL</label>
      <input type="url" id="linkedinUrl">
    </div>

    <div class="row">
      <div class="field-group">
        <label>Job Title</label>
        <input type="text" id="jobTitle">
      </div>
      <div class="field-group">
        <label>Company</label>
        <input type="text" id="company">
      </div>
    </div>

    <div class="field-group">
      <label>Years of Experience</label>
      <input type="text" id="yearsOfExperience">
    </div>

    <div class="actions">
      <button class="btn btn-save" id="saveBtn">Save Profile</button>
      <button class="btn btn-fill" id="fillBtn">Auto-Fill</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    ♠ ♥ ♦ ♣
  </div>
</body>
</html>
