<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop The Sequence — Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #F5F0E8;
      color: #2C2420;
      min-height: 100vh;
    }

    .topbar {
      background: #2C2420;
      color: #F5F0E8;
      padding: 20px 0 16px;
      text-align: center;
      position: relative;
    }

    .topbar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #C8102E, #B8860B, #1D4289, #B8860B, #C8102E);
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .topbar p {
      font-size: 12px;
      color: #B8A99A;
      margin-top: 4px;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #7A6F65;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #D5CBBF;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #7A6F65;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #D5CBBF;
      border-radius: 5px;
      font-size: 14px;
      background: #FFFDF8;
      color: #2C2420;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: #B8860B;
      box-shadow: 0 0 0 2px rgba(184, 134, 11, 0.15);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .field-group {
      flex: 1;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #1D4289;
    }

    .checkbox-group label {
      font-size: 13px;
      font-weight: 500;
      color: #2C2420;
      text-transform: none;
      letter-spacing: 0;
    }

    /* Experience entry card */
    .experience-entry {
      background: #FFFDF8;
      border: 1px solid #D5CBBF;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
    }

    .experience-entry .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .experience-entry .entry-number {
      font-size: 12px;
      font-weight: 700;
      color: #1D4289;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-remove-entry {
      background: none;
      border: 1px solid #D5CBBF;
      color: #C8102E;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-remove-entry:hover {
      background: #C8102E;
      color: #FFFDF8;
      border-color: #C8102E;
    }

    .btn-add-entry {
      background: none;
      border: 2px dashed #D5CBBF;
      color: #7A6F65;
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }

    .btn-add-entry:hover {
      border-color: #1D4289;
      color: #1D4289;
      background: rgba(29, 66, 137, 0.04);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(44, 36, 32, 0.15);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-save {
      background: #1D4289;
      color: #FFFDF8;
    }

    .btn-save:hover {
      background: #153268;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
      color: #B8860B;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Stop The Sequence</h1>
    <p>Manage your profile</p>
  </div>

  <div class="container">

    <!-- Personal Information -->
    <div class="section">
      <div class="section-title">Personal Information</div>
      <div class="row">
        <div class="field-group">
          <label>First Name</label>
          <input type="text" id="firstName">
        </div>
        <div class="field-group">
          <label>Last Name</label>
          <input type="text" id="lastName">
        </div>
      </div>
      <div class="field-group">
        <label>Email</label>
        <input type="email" id="email">
      </div>
      <div class="row">
        <div class="field-group" style="flex: 0 0 120px;">
          <label>Country Code</label>
          <input type="text" id="phoneCountryCode" placeholder="+1">
        </div>
        <div class="field-group">
          <label>Phone</label>
          <input type="tel" id="phone">
        </div>
      </div>
      <div class="field-group">
        <label>Address Line 1</label>
        <input type="text" id="address">
      </div>
      <div class="field-group">
        <label>Address Line 2</label>
        <input type="text" id="address2">
      </div>
      <div class="row">
        <div class="field-group">
          <label>City</label>
          <input type="text" id="city">
        </div>
        <div class="field-group">
          <label>State</label>
          <input type="text" id="state">
        </div>
        <div class="field-group">
          <label>Zip Code</label>
          <input type="text" id="zipCode">
        </div>
        <div class="field-group">
          <label>Country</label>
          <input type="text" id="country">
        </div>
      </div>
      <div class="field-group">
        <label>LinkedIn URL</label>
        <input type="url" id="linkedinUrl">
      </div>
    </div>

    <!-- Work Preferences -->
    <div class="section">
      <div class="section-title">Work Preferences</div>
      <div class="row">
        <div class="field-group">
          <label>Years of Experience</label>
          <input type="text" id="yearsOfExperience">
        </div>
        <div class="field-group">
          <label>Work Authorization</label>
          <select id="workAuthorization">
            <option value="">Select…</option>
            <option value="Yes">Yes — Authorized to work</option>
            <option value="No">No — Not authorized</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="field-group">
          <label>Sponsorship Needed</label>
          <select id="sponsorshipNeeded">
            <option value="">Select…</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="field-group">
          <label>Willing to Relocate</label>
          <select id="willingToRelocate">
            <option value="">Select…</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Resume & Documents -->
    <div class="section">
      <div class="section-title">Resume & Documents</div>
      <p style="margin-top: 0; margin-bottom: 20px; font-size: 0.9em; color: #555;">
        Upload your resume to automatically attach it to file inputs on job applications.
      </p>
      
      <div class="field-group">
        <label>Resume (PDF, DOCX)</label>
        <div id="resume-upload-container" style="display: flex; gap: 10px; align-items: center; border: 1px dashed #ccc; padding: 10px; border-radius: 6px; background: #fafafa;">
          <input type="file" id="resumeFile" accept=".pdf,.doc,.docx" style="max-width: 250px;">
          <span id="resumeMetadata" style="font-size: 0.9em; color: #166534; display: none; margin-left: auto;"></span>
          <button id="removeResumeBtn" type="button" class="btn-secondary" style="display: none; padding: 4px 12px; font-size: 0.85em; border-color: #dc2626; color: #dc2626; margin-left: auto;">Remove</button>
        </div>
      </div>
    </div>

    <!-- Work Experience Entries -->
    <div class="section">
      <div class="section-title">Work Experience</div>
      <div id="experienceList"></div>
      <button class="btn-add-entry" id="addExperienceBtn">+ Add Experience</button>
    </div>

    <div class="actions">
      <button class="btn btn-save" id="saveBtn">Save Profile</button>
    </div>
    <div class="status" id="status"></div>

  </div>
</body>
</html>
